# =============================================================================
# GraphCLIP v2 - QuiltNet Backbone
# =============================================================================
# QuiltNet: Vision-Language Models for Histopathology
# Pre-trained on QUILT-1M (1 million pathology image-text pairs from YouTube)
# Paper: https://arxiv.org/abs/2312.04746
# HuggingFace: wisdomik/QuiltNet-B-32
#
# Use: python train.py --trainer GraphCLIP_v2 --config-file configs/trainers/GraphCLIP_v2/quiltnet.yaml ...

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32           # Reduced to prevent OOM
  TEST:
    BATCH_SIZE: 32
  NUM_WORKERS: 0             # Single-process to avoid memory duplication

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  # QuiltNet uses OpenAI CLIP normalization
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "adamw"
  LR: 0.001
  MAX_EPOCH: 100
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 5

MODEL:
  BACKBONE:
    NAME: "quiltnet"         # Key from MODEL_CONFIGS in model_registry.py
    # These are looked up automatically from MODEL_CONFIGS:
    # FRAMEWORK: "open_clip"
    # HUB_NAME: "hf-hub:wisdomik/QuiltNet-B-32"
    # FEATURE_DIM: 512

TRAINER:
  COOP:
    PREC: "fp32"
